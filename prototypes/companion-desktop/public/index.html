<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>companion-desktop — prototype</title>
  <style>
    /*
     * Warm Afternoon Room — ADR-0004 / docs/ROOM_DESIGN.md §A-2
     * パレット：クリーム／オーカー主体 + サージュ緑のワンポイント
     * 構図：三層構成、窓はバック・サード、最高輝度はアバター近く、午後の斜光
     */
    :root {
      --cream:       #FFF2D8;   /* 最明 — ハイライト、カーテン */
      --ochre-pale:  #F7D9B0;   /* 上壁 */
      --ochre-warm:  #E8B892;   /* 下壁、床ハイライト */
      --wood:        #C98A6B;   /* 床 */
      --anchor-dark: #6B4E3D;   /* アンカー暗色 — 幅木、棚、影 */
      --sage:        #A8C4A2;   /* サージュ緑 — 一点だけ */

      --window-sky-top:    #f1e4c8;  /* 斜陽の空、低彩度 */
      --window-sky-bottom: #e8b892;
      --frame:             #fff2d8;
      --frame-shade:       #b89070;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: #4a3a2e;
      font-family: "Yu Gothic", "Hiragino Sans", system-ui, sans-serif;
    }

    /* -------- 背景：壁（下層背景） -------- */
    /* 上下で色を分ける + 60% 位置にチェアレール */
    body {
      background:
        linear-gradient(
          to bottom,
          var(--ochre-pale) 0%,
          var(--ochre-pale) 60%,
          var(--ochre-warm) 60.3%,
          var(--ochre-warm) 72%
        );
    }

    /* チェアレール（壁の水平モール） — 60% 高にアンカー暗色の線 */
    .chair-rail {
      position: fixed;
      left: 0; right: 0;
      top: 60%;
      height: 3px;
      background: var(--anchor-dark);
      opacity: 0.55;
      box-shadow: 0 2px 0 rgba(107, 78, 61, 0.18);
      pointer-events: none;
      z-index: 1;
    }

    /* -------- 背景：窓（バック・サード左側） -------- */
    /* 三分割グリッドの左 1/3 に配置。中央対称を避ける。 */
    .window {
      position: fixed;
      left: 12%;
      top: 14%;
      width: 22%;
      max-width: 280px;
      aspect-ratio: 3 / 4;
      background: linear-gradient(
        180deg,
        var(--window-sky-top)    0%,
        var(--window-sky-bottom) 100%
      );
      border: 10px solid var(--frame);
      border-radius: 6px;
      box-shadow:
        0 6px 18px rgba(60, 40, 20, 0.18),
        inset 0 0 0 2px var(--frame-shade);
      overflow: hidden;
      z-index: 1;
    }

    /* 窓の十字フレーム */
    .window::before,
    .window::after {
      content: "";
      position: absolute;
      background: var(--frame);
      box-shadow: inset 0 0 0 1px var(--frame-shade);
    }
    .window::before { /* vertical bar */
      left: 50%; top: 0; bottom: 0;
      width: 8px; transform: translateX(-4px);
    }
    .window::after { /* horizontal bar */
      top: 50%; left: 0; right: 0;
      height: 8px; transform: translateY(-4px);
    }

    /* 遠景雲（窓の中） */
    .cloud {
      position: absolute;
      width: 60%;
      height: 12%;
      background: var(--cream);
      opacity: 0.75;
      border-radius: 50%;
      filter: blur(6px);
    }
    .cloud.a { top: 24%; left: 14%; }
    .cloud.b { top: 58%; left: 38%; width: 50%; height: 9%; }

    /* レースカーテン（窓にだけかける、低彩度クリーム） */
    .curtain {
      position: fixed;
      top: 14%;
      height: 30vh;
      max-height: 380px;
      width: 5%;
      max-width: 60px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 242, 216, 0.65) 0%,
          rgba(255, 242, 216, 0.25) 100%
        );
      pointer-events: none;
      z-index: 2;
    }
    .curtain.left {
      left: 11%;
      background-image: repeating-linear-gradient(
        -4deg,
        rgba(255,255,255,0.0) 0 9px,
        rgba(255,242,216,0.55) 9px 11px
      );
    }
    .curtain.right {
      left: 30%;
      background-image: repeating-linear-gradient(
        4deg,
        rgba(255,255,255,0.0) 0 9px,
        rgba(255,242,216,0.55) 9px 11px
      );
    }

    /* -------- 中景：本棚（右側、壁の低い方に） -------- */
    /* アンカー暗色の木製棚。アバターから離して、彩度もサイズも抑える。 */
    .bookshelf {
      position: fixed;
      right: 4%;
      top: 42%;
      width: 14%;
      max-width: 160px;
      height: 18%;
      max-height: 130px;
      background: var(--anchor-dark);
      border-radius: 2px;
      box-shadow:
        0 4px 10px rgba(60, 40, 20, 0.25),
        inset 0 -3px 0 rgba(0,0,0,0.22);
      z-index: 1;
    }
    /* 本の背表紙 — 低彩度の色をランダムっぽく並べる */
    .bookshelf::before {
      content: "";
      position: absolute;
      left: 4px; right: 4px; top: 4px;
      height: calc(50% - 6px);
      background:
        linear-gradient(to right,
          #c98a6b 0 14%,
          #8a7a5a 14% 24%,
          #a8c4a2 24% 32%,
          #6b4e3d 32% 40%,
          #e8b892 40% 52%,
          #8a9c7a 52% 60%,
          #c08664 60% 72%,
          #6b4e3d 72% 80%,
          #a8c4a2 80% 92%,
          #c98a6b 92% 100%
        );
      border-radius: 1px;
    }
    .bookshelf::after {
      content: "";
      position: absolute;
      left: 4px; right: 4px;
      top: calc(50% + 2px);
      height: calc(50% - 6px);
      background:
        linear-gradient(to right,
          #a8c4a2 0 10%,
          #6b4e3d 10% 22%,
          #e8b892 22% 34%,
          #8a7a5a 34% 44%,
          #c98a6b 44% 56%,
          #a8c4a2 56% 66%,
          #6b4e3d 66% 78%,
          #c08664 78% 88%,
          #8a9c7a 88% 100%
        );
      border-radius: 1px;
    }

    /* -------- 前景：床 -------- */
    .floor {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      height: 28vh;
      background:
        linear-gradient(
          to bottom,
          var(--ochre-warm) 0%,
          var(--wood)       30%,
          var(--wood)       100%
        );
      box-shadow: 0 -2px 8px rgba(60, 40, 20, 0.2) inset;
      z-index: 2;
    }
    .floor::before {
      content: "";
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(0,0,0,0.0) 0 48px,
        rgba(60, 40, 20, 0.14) 48px 49px
      );
      opacity: 0.8;
    }
    /* 幅木（アンカー暗色） */
    .floor::after {
      content: "";
      position: absolute; left: 0; right: 0; top: -5px;
      height: 5px;
      background: var(--anchor-dark);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* -------- 前景：観葉植物（サージュ緑、アクセント一点） -------- */
    /* 床の手前、右端ではなく少し内側。アバターから離す。 */
    .plant {
      position: fixed;
      right: 6%;
      bottom: 22vh;
      width: 90px;
      height: 150px;
      z-index: 3;
      filter: drop-shadow(0 3px 6px rgba(60, 40, 20, 0.25));
    }

    /* -------- 午後の斜光 -------- */
    /* 窓（左上）から差し込む暖色の指向性光。一つだけ。 */
    .afternoon-light {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background:
        linear-gradient(
          115deg,
          rgba(255, 242, 216, 0.32) 0%,
          rgba(255, 242, 216, 0.10) 28%,
          rgba(255, 242, 216, 0.00) 50%
        );
      mix-blend-mode: screen;
    }

    /* ソフトヴィネット（暗色は暖系ブラウン寄り） */
    .vignette {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(
        ellipse at 55% 55%,
        rgba(0,0,0,0) 55%,
        rgba(60, 40, 20, 0.32) 100%
      );
    }

    /* -------- Character canvas on top -------- */
    #stage {
      position: fixed; inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 6;
      pointer-events: none;
    }

    /* -------- Overlay UI -------- */
    #status {
      position: fixed;
      left: 12px;
      top: 12px;
      font-size: 12px;
      color: #6b4e3d;
      background: rgba(255, 242, 216, 0.8);
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    #caption {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      max-width: 80%;
      padding: 10px 14px;
      background: rgba(255, 242, 216, 0.9);
      border: 1px solid rgba(107, 78, 61, 0.35);
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      color: #4a3a2e;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 2px 10px rgba(60, 40, 20, 0.18);
      z-index: 11;
    }
    #caption.visible { opacity: 1; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.4/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.1.4/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- ===== Warm Afternoon Room — 三層構成 ===== -->

  <!-- 背景層：壁＋チェアレール＋窓 -->
  <div class="chair-rail"></div>

  <div class="window">
    <div class="cloud a"></div>
    <div class="cloud b"></div>
  </div>
  <div class="curtain left"></div>
  <div class="curtain right"></div>

  <!-- 中景：本棚（右手前の壁） -->
  <div class="bookshelf"></div>

  <!-- 前景：床＋観葉植物 -->
  <div class="floor"></div>

  <svg class="plant" viewBox="0 0 90 160" xmlns="http://www.w3.org/2000/svg">
    <!-- 鉢（アンカー暗色＋ウォームブラウン） -->
    <path d="M18 120 h54 l-4 34 h-46 z" fill="#6B4E3D" stroke="#3e2a1e" stroke-width="1.5"/>
    <rect x="14" y="116" width="62" height="8" rx="2" fill="#C98A6B" stroke="#3e2a1e" stroke-width="1"/>
    <!-- 葉っぱ（サージュ緑の三階調） -->
    <g fill="#6e8a6a" stroke="#3e4e3a" stroke-width="1">
      <path d="M45 118 C 20 110, 12 80, 26 60 C 34 80, 44 90, 45 118 Z"/>
      <path d="M45 118 C 70 110, 80 78, 64 56 C 56 80, 48 96, 45 118 Z"/>
    </g>
    <g fill="#A8C4A2" stroke="#6e8a6a" stroke-width="1">
      <path d="M45 118 C 30 100, 28 70, 44 46 C 50 70, 50 94, 45 118 Z"/>
    </g>
  </svg>

  <!-- アバター（キャラクター層） -->
  <canvas id="stage"></canvas>

  <!-- 最上層：午後の斜光＋ヴィネット -->
  <div class="afternoon-light"></div>
  <div class="vignette"></div>

  <div id="status">loading...</div>
  <div id="caption"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
